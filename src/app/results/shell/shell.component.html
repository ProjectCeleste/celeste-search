<div class="__wrapper">

  <!-- TYPE / RARITY -->
  @if (type || rarity) {
    <div class="row --header">
      <strong>{{ type }}</strong>
      <div class="__rarity --{{ rarity }}">
        {{ rarity }}
      </div>
    </div>
  }

  <!-- ICON / NAME -->
  @if (icon && sprite || name) {
    <div class="row --name">
      @if (icon && sprite) {
        <div class="icon--{{ sprite }} icon--{{ sprite }}--{{ icon }}">
        </div>
      }
      @if (name) {
        <div class="__name --{{ rarity }}">
          {{ name }}
        </div>
      }
    </div>
  }

  <!-- DESCRIPTION -->
  @if (description) {
    <div class="row --description --positive">
      {{ description }}
    </div>
  }

  <!-- CUSTOM CONTENT -->
  <ng-content></ng-content>

  <!-- SOURCES -->
  @if (vendors) {
    <cis-vendors [vendors]="vendors" [levels]="levels" [rarities]="rarities"></cis-vendors>
  }
  <cis-marketplace [queries]="marketplace">
  </cis-marketplace>

</div>
