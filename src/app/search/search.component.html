<div class="__input-container" (window:pointerup)="keepInputFocused()">

  <input type="text" class="__input" placeholder="Type anything..." aria-label="Search" autocomplete="off"
    autocorrect="off" autocapitalize="off" spellcheck="false" [formControl]="inputModel" #inputRef />

    @if (!(isEmpty | async)) {
      <cis-icon-button icon="clear" (click)="clear()">
      </cis-icon-button>
    }

  </div>
