<div class="__tabs">

  @for (tab of tabs; track tab; let i = $index) {
    <cis-tooltip [text]="tab.name" class="__tab-wrapper">
      <button type="button" class="__tab" aria-label="tab.name" [class.--active]="(activeTabChange | async) === i"
        (click)="setActiveTab(i)">
        <img [alt]="tab.name" class="__image" src="/assets/tabs/{{ tab.icon }}.webp">
      </button>
    </cis-tooltip>
  }

</div>
